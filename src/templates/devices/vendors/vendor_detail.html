{% extends 'base.html' %}

{% block title %}{{ vendor.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8">
            <h2>Vendor Details</h2>
            
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endfor %}
            {% endif %}
            
            <table class="table table-borderless">
                <tr>
                    <th>Name:</th>
                    <td>{{ vendor.name }}</td>
                </tr>
            </table>
            
            <div class="mt-3">
                <a href="{% url 'devices:vendor-update' vendor.pk %}" class="btn btn-primary">Редактировать</a>
{#                <a href="{% url 'parts:vendor_delete' vendor.pk %}" class="btn btn-danger">Delete</a>#}
                <a href="{% url 'devices:vendor-list' %}" class="btn btn-secondary">Список производителей</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
